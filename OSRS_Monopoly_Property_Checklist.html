<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSRS Monopoly Property Checklist</title>
<style>
:root{--bg:#111714;--panel:#1b2520;--ink:#f4efe3;--muted:#b7c2ba;--gold:#e6b84f;--line:#3a4940}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0d120f,#18231d);color:var(--ink);font:16px/1.45 system-ui,sans-serif}header{position:sticky;top:0;z-index:3;background:#111714ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:18px}.wrap{max-width:1280px;margin:auto}.top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}h1{font-family:Georgia,serif;margin:0;color:var(--gold);font-size:clamp(1.5rem,4vw,2.35rem)}.controls{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}input,select,button{border:1px solid var(--line);border-radius:9px;background:#253129;color:var(--ink);padding:10px 12px;font:inherit}button{cursor:pointer}button:hover{border-color:var(--gold)}#stats{color:var(--muted);margin-top:9px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;padding:22px 18px 48px}.card{--c:#9a6b45;background:var(--panel);border:1px solid var(--line);border-top:11px solid var(--c);border-radius:13px;overflow:hidden;box-shadow:0 9px 25px #0004}.card.complete{outline:2px solid #65d18a}.owner{padding:13px 15px 10px;background:#151d19}.owner>label{display:block;color:var(--muted);font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}.owner-row{display:grid;grid-template-columns:1fr 48px;gap:8px}.owner-row input[data-team]{width:100%;background:#202c25;font-weight:800}.owner-row input[type=color]{width:48px;height:44px;padding:4px;background:#202c25;cursor:pointer}.owner-row input[type=color]::-webkit-color-swatch{border:0;border-radius:5px}.owner-row input[type=color]::-moz-color-swatch{border:0;border-radius:5px}.title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:13px 15px 4px}.title h2{font:700 1.3rem Georgia,serif;margin:0}.tag{white-space:nowrap;color:var(--c);font-size:.8rem;font-weight:800;text-transform:uppercase}.costs{padding:0 15px 10px;color:var(--gold);font-weight:700}.checks{padding:3px 15px 13px}.check{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}.check input{width:19px;height:19px;margin:2px 0;accent-color:#65d18a}.check.done span{text-decoration:line-through;color:#819087}.check small{display:block;color:var(--muted);margin-top:2px}.rents{border-collapse:collapse;width:calc(100% - 30px);margin:0 15px 15px;font-size:.88rem}.rents td{border-top:1px solid var(--line);padding:5px}.rents td:last-child{text-align:right;color:var(--gold);font-weight:700}.empty{padding:70px;text-align:center;color:var(--muted)}@media(max-width:600px){.controls{margin-left:0;width:100%}.controls input{flex:1}.grid{grid-template-columns:1fr;padding:14px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="top"><h1>OSRS Monopoly Checklist</h1><div class="controls"><input id="search" placeholder="Search properties…"><select id="filter"><option value="all">All properties</option><option value="open">Not purchased</option><option value="owned">Purchased</option><option value="complete">All tasks complete</option></select><button id="reset" type="button">Reset</button></div></div><div id="stats"></div></div></header>
<main id="grid" class="grid wrap"></main>
<script>
const P=[
['Lumbridge','Brown',120,100,'A player must kill Demonic Brutus and a player must get the Brutus pet (dupe pets allowed).','Any three Tormented Demon uniques.','Abyssal Dagger and form an Abyssal Bludgeon as a team (claw, spine, and axon).',[['No Houses',4],['1 House',25],['2 Houses',60],['3 Houses',75],['4 Houses',150],['Hotel',250]]],
['Varrock','Brown',70,60,'5× Scurrius Spine.','Hill Giant Club.','Bryophyta’s Essence.',[['No Houses',3],['1 House',15],['2 Houses',35],['3 Houses',45],['4 Houses',90],['Hotel',150]]],
['Port Phasmatys','Sky Blue',200,165,'5× Black Mask.','Create a Noxious Halberd as a team (point, blade, and pommel).','2× Araxyte Fang.',[['No Houses',8],['1 House',40],['2 Houses',100],['3 Houses',125],['4 Houses',250],['Hotel',400]]],
['Slepe','Sky Blue',570,475,'1 unique: staff, armour, mace, or orb.','2 uniques: staff, armour, mace, or orbs.','3 uniques: staff, armour, mace, or orbs.',[['No Houses',25],['1 House',115],['2 Houses',285],['3 Houses',355],['4 Houses',710],['Hotel',1150]]],
['Ver Sinhaza','Sky Blue',3000,2500,'Any two purples (no pets or kits).','Any Justiciar piece.','Scythe of Vitur.',[['No Houses',120],['1 House',600],['2 Houses',1500],['3 Houses',1875],['4 Houses',3750],['Hotel',6000]]],
['Port Sarim','Pink',50,40,'5× Giantsoul Amulet.','Flippers and Mudskipper Hat (Mogres).','Complete two Twinflame Staves.',[['No Houses',2],['1 House',10],['2 Houses',25],['3 Houses',30],['4 Houses',60],['Hotel',100]]],
['Falador','Pink',120,100,'Any 2 uniques (no pet or jar).','Primordial Crystal.','3 of any crystal.',[['No Houses',5],['1 House',25],['2 Houses',60],['3 Houses',75],['4 Houses',150],['Hotel',250]]],
['God Wars Dungeon','Pink',640,530,'Bandos Chestplate or Tassets.','Armadyl Crossbow or hilt.','Complete a Godsword (shards 1, 2, 3 and any hilt).',[['No Houses',25],['1 House',130],['2 Houses',320],['3 Houses',400],['4 Houses',800],['Hotel',1300]]],
['Ancient Prison','Pink',1500,1250,'Zaryte Vambraces.','Nihil Horn.','Complete a Torva set as a team (helm, body, and legs).',[['No Houses',60],['1 House',300],['2 Houses',750],['3 Houses',940],['4 Houses',1875],['Hotel',3000]]],
['Hosidius','Orange',480,400,'Sarachnis Cudgel.','Jar of Eyes.','Sraracha (dupe pet counts).',[['No Houses',20],['1 House',100],['2 Houses',240],['3 Houses',300],['4 Houses',600],['Hotel',960]]],
['Molch','Orange',110,90,'5× Xeric Talisman (Shaman or regular Lizardmen).','Dragon Warhammer.','Curved Bone.',[['No Houses',5],['1 House',20],['2 Houses',55],['3 Houses',70],['4 Houses',140],['Hotel',220]]],
['Mount Karuulm','Orange',320,265,'Hydra’s Tail or Leather.','Create a Brimstone Ring as a team (eye, fang, and heart; normal hydras allowed).','Hydra’s Claw.',[['No Houses',15],['1 House',65],['2 Houses',160],['3 Houses',200],['4 Houses',400],['Hotel',650]]],
['Chasm of Fire','Orange',560,465,'Any Yama unique (no pet).','Any armour piece.','2 armour pieces.',[['No Houses',25],['1 House',110],['2 Houses',280],['3 Houses',350],['4 Houses',700],['Hotel',1100]]],
['Mount Quidamortem','Orange',2350,1950,'Any unique (no Onyx or Torn Prayer Scroll).','Any Ancestral piece.','Any mega rare: Elder Maul, Kodai Insignia, or Twisted Bow.',[['No Houses',95],['1 House',470],['2 Houses',1175],['3 Houses',1470],['4 Houses',2940],['Hotel',4700]]],
['Crash Site','Yellow',210,175,'2 Zenyte Shards.','4 Zenyte Shards.','Create a Ballista as a team (limbs, spring, light or heavy frame, and monkey tail).',[['No Houses',8],['1 House',40],['2 Houses',105],['3 Houses',130],['4 Houses',260],['Hotel',420]]],
['Kraken Cove','Yellow',160,130,'Kraken Tentacle (boss or cave kraken).','Trident of the Seas (Kraken boss).','Mist Battlestaff (Waterfiend; superior drop also counts).',[['No Houses',6],['1 House',30],['2 Houses',80],['3 Houses',100],['4 Houses',200],['Hotel',320]]],
['Castle Wars','Yellow',160,130,'3× Occult Necklace.','1 Smoke Battlestaff.','1 Dragon Chainbody (Thermy only).',[['No Houses',6],['1 House',30],['2 Houses',80],['3 Houses',100],['4 Houses',200],['Hotel',320]]],
['Ruins of Unkah','Green',270,225,'Fish Barrel and Tackle Box. If owned, the 25-soaked-pages drop works. Do not stack rewards before bingo starts.','Dragon 2H Sword (KQ only).','Dragon Pickaxe (KQ only).',[['No Houses',10],['1 House',55],['2 Houses',135],['3 Houses',170],['4 Houses',340],['Hotel',540]]],
['The Scar','Green',430,355,'5× Awakener Orbs (any DT2 boss).','Any Virtus piece (any DT2 boss).','Leviathan’s Lure.',[['No Houses',17],['1 House',90],['2 Houses',215],['3 Houses',270],['4 Houses',540],['Hotel',860]]],
['Necropolis','Green',3470,2880,'Osmumten’s Fang.','Full Masori as a team (mask, body, and chaps).','Tumeken’s Shadow.',[['No Houses',140],['1 House',700],['2 Houses',1735],['3 Houses',2340],['4 Houses',4340],['Hotel',7000]]],
['Weiss','Blue',260,215,'Basilisk Jaw.','5× Venator Shards (make a bow as a team).','Eye of the Duke.',[['No Houses',10],['1 House',50],['2 Houses',130],['3 Houses',160],['4 Houses',325],['Hotel',520]]],
['Rellekka','Blue',570,470,'3 Vorkath Heads (the pre-50 KC head does not count).','Any unique: dragonbone necklace, jar of decay, pet/dupe pet, or either visage.','Any visage (Draconic or Skeletal).',[['No Houses',25],['1 House',115],['2 Houses',285],['3 Houses',350],['4 Houses',710],['Hotel',1150]]]
];
const R=[
['Sail to Waterbirth Island','Railroad',500,'Collect all DK rings: Berserker, Archers, Seers, and Warrior.',[['1 Sail',65],['2 Sails',130],['3 Sails',250],['4 Sails',500]]],
['Sail to Trahaearn','Railroad',500,'Crystal Tool Seed.',[['1 Sail',65],['2 Sails',130],['3 Sails',250],['4 Sails',500]]],
['Sail to The Darkfrost','Railroad',500,'Dragon Hunter Wand.',[['1 Sail',65],['2 Sails',130],['3 Sails',250],['4 Sails',500]]],
['Sail to Wilderness','Railroad',500,'Create a Voidwaker as a team (blade, hilt, and gem).',[['1 Sail',65],['2 Sails',130],['3 Sails',250],['4 Sails',500]]],
['Mor Ul Rek (Outer)','Utility',125,'30-minute-or-less Fire Cape.',[['1 Utility','Roll 1–6 × $4'],['2 Utilities','Roll 1–6 × $10']]],
['Mor Ul Rek (Inner)','Utility',600,'Infernal Cape.',[['1 Utility','Roll 1–6 × $4'],['2 Utilities','Roll 1–6 × $10']]]
];
const colors={'Brown':'#966542','Sky Blue':'#63c7e8','Pink':'#e675a8','Orange':'#e99539','Yellow':'#e7c849','Green':'#54ad68','Blue':'#3978ca','Railroad':'#aeb7b1','Utility':'#8f70c9'};
const data=[...P.map(x=>({name:x[0],type:x[1],initial:x[2],house:x[3],tasks:[['Purchased / initial challenge',x[4]],['House challenge',x[5]],['Hotel challenge',x[6]]],rents:x[7]})),...R.map(x=>({name:x[0],type:x[1],initial:x[2],tasks:[['Purchased / initial challenge',x[3]]],rents:x[4]}))];
let state=JSON.parse(localStorage.getItem('osrs-monopoly-checklist-v1')||'{}');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('osrs-monopoly-checklist-v1',JSON.stringify(state));render()}
function render(){const q=document.querySelector('#search').value.toLowerCase(),f=document.querySelector('#filter').value;let shown=0;const html=data.map((p,i)=>{let s=state[i]||{team:'',teamColor:'#f4efe3',checks:[]},owned=!!s.checks[0],complete=p.tasks.every((_,j)=>s.checks[j]),teamColor=s.teamColor||'#f4efe3';if(!p.name.toLowerCase().includes(q)||f==='open'&&owned||f==='owned'&&!owned||f==='complete'&&!complete)return'';shown++;return `<article class="card ${complete?'complete':''}" style="--c:${colors[p.type]}"><div class="owner"><label for="team-${i}">Team name</label><div class="owner-row"><input id="team-${i}" data-team="${i}" value="${esc(s.team||'')}" style="color:${teamColor}" placeholder="Enter purchasing team…"><input type="color" data-team-color="${i}" value="${teamColor}" aria-label="Choose team-name color" title="Choose team-name color"></div></div><div class="title"><h2>${esc(p.name)}</h2><span class="tag">${esc(p.type)}</span></div><div class="costs">Initial: $${p.initial}${p.house?` · House: $${p.house}`:''}</div><div class="checks">${p.tasks.map((t,j)=>`<label class="check ${s.checks[j]?'done':''}"><input type="checkbox" data-check="${i},${j}" ${s.checks[j]?'checked':''}><span><b>${t[0]}</b><small>${esc(t[1])}</small></span></label>`).join('')}</div><table class="rents">${p.rents.map(r=>`<tr><td>${esc(r[0])}</td><td>${typeof r[1]==='number'?'$':''}${esc(r[1])}</td></tr>`).join('')}</table></article>`}).join('');document.querySelector('#grid').innerHTML=html||'<div class="empty">No properties match this filter.</div>';let owned=data.filter((_,i)=>state[i]?.checks?.[0]).length,done=data.filter((p,i)=>p.tasks.every((_,j)=>state[i]?.checks?.[j])).length;document.querySelector('#stats').textContent=`${owned} of ${data.length} purchased · ${done} fully complete · ${shown} shown`;}
document.addEventListener('input',e=>{if(e.target.matches('[data-team]')){let i=e.target.dataset.team;state[i]??={team:'',teamColor:'#f4efe3',checks:[]};state[i].team=e.target.value;localStorage.setItem('osrs-monopoly-checklist-v1',JSON.stringify(state))}else if(e.target.matches('[data-team-color]')){let i=e.target.dataset.teamColor;state[i]??={team:'',teamColor:'#f4efe3',checks:[]};state[i].teamColor=e.target.value;document.querySelector(`[data-team="${i}"]`).style.color=e.target.value;localStorage.setItem('osrs-monopoly-checklist-v1',JSON.stringify(state))}else if(e.target.id==='search')render()});
document.addEventListener('change',e=>{if(e.target.matches('[data-check]')){let[i,j]=e.target.dataset.check.split(',');state[i]??={team:'',checks:[]};state[i].checks[j]=e.target.checked;save()}else if(e.target.id==='filter')render()});
document.querySelector('#reset').onclick=()=>{if(confirm('Clear every team name and checkbox?')){state={};save()}};render();
</script>
</body>
</html>
