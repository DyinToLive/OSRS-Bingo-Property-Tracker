*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0d120f,#18231d);color:var(--ink);font:16px/1.45 system-ui,sans-serif}header{position:sticky;top:0;z-index:3;background:#111714ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:18px}.wrap{max-width:1280px;margin:auto}.top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}h1{font-family:Georgia,serif;margin:0;color:var(--gold);font-size:clamp(1.5rem,4vw,2.35rem)}.controls{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}input,select,button{border:1px solid var(--line);border-radius:9px;background:#253129;color:var(--ink);padding:10px 12px;font:inherit}button{cursor:pointer}button:hover{border-color:var(--gold)}button:disabled{opacity:.45;cursor:not-allowed}#stats,#syncbar{color:var(--muted);margin-top:9px}#syncbar{display:flex;gap:12px;flex-wrap:wrap;font-size:.88rem}.online{color:#65d18a}.offline{color:#ffbc66}.error{color:#ff8585}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;padding:22px 18px 48px}.card{--c:#9a6b45;background:var(--panel);border:1px solid var(--line);border-top:11px solid var(--c);border-radius:13px;overflow:hidden;box-shadow:0 9px 25px #0004}.card.complete{outline:2px solid #65d18a}.owner{padding:13px 15px 10px;background:#151d19}.owner>label{display:block;color:var(--muted);font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}.owner-row{display:grid;grid-template-columns:1fr 48px;gap:8px}.owner-row input[data-team]{width:100%;background:#202c25;font-weight:800}.owner-row input[type=color]{width:48px;height:44px;padding:4px;background:#202c25;cursor:pointer}.owner-row input[type=color]::-webkit-color-swatch{border:0;border-radius:5px}.owner-row input[type=color]::-moz-color-swatch{border:0;border-radius:5px}.title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:13px 15px 4px}.title h2{font:700 1.3rem Georgia,serif;margin:0}.tag </style>

<body>

const R=[
['Sail to Waterbirth Island','Railroad',500,'Collect all DK rings: Berserker, Archers, Seers, and Warrior.',[['1 Sail',65],['2 Sails',130],['3 Sails',250],['4 Sails',500]]],
['Sail to Trahaearn','Railroad',500,'Crystal Tool Seed.',[['1 Sail',65],['2 Sails',130],['3 Sails',250],['4 Sails',500]]],
['Sail to The Darkfrost','Railroad',500,'Dragon Hunter Wand.',[['1 Sail',65],['2 Sails',130],['3 Sails',250],['4 Sails',500]]],
['Sail to Wilderness','Railroad',500,'Create a Voidwaker as a team (blade, hilt, and gem).',[['1 Sail',65],['2 Sails',130],['3 Sails',250],['4 Sails',500]]],
['Mor Ul Rek (Outer)','Utility',125,'30-minute-or-less Fire Cape.',[['1 Utility','Roll 1–6 × $4'],['2 Utilities','Roll 1–6 × $10']]],
['Mor Ul Rek (Inner)','Utility',600,'Infernal Cape.',[['1 Utility','Roll 1–6 × $4'],['2 Utilities','Roll 1–6 × $10']]]
];
const colors={'Brown':'#966542','Sky Blue':'#63c7e8','Pink':'#e675a8','Orange':'#e99539','Yellow':'#e7c849','Green':'#54ad68','Blue':'#3978ca','Railroad':'#aeb7b1','Utility':'#8f70c9'};
const data=[...P.map(x=>({name:x[0],type:x[1],initial:x[2],house:x[3],tasks:[['Purchased / initial challenge',x[4]],['House challenge',x[5]],['Hotel challenge',x[6]]],rents:x[7]})),...R.map(x=>({name:x[0],type:x[1],initial:x[2],tasks:[['Purchased / initial challenge',x[3]]],rents:x[4]}))];
let state={},currentUser=null,eventOwner=null,unsubProperties=null,typingTimers={};
const params=new URLSearchParams(location.search);let eventId=(params.get('event')||'').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,40);
if(!eventId){eventId='bingo-'+crypto.getRandomValues(new Uint32Array(1))[0].toString(36);params.set('event',eventId);history.replaceState({},'',`${location.pathname}?${params}`)}
const eventRef=doc(db,'events',eventId),propertiesRef=collection(eventRef,'properties');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>({team:'',teamColor:'#f4efe3',checks:[]});
const isOrganizer=()=>!!currentUser&&currentUser.uid===eventOwner;
function setConnection(text,cls=''){const el=document.querySelector('#connection');el.textContent=text;el.className=cls}
function render(){const active=document.activeElement,activeId=active?.id,sel=active?.selectionStart,q=document.querySelector('#search').value.toLowerCase(),f=document.querySelector('#filter').value;let shown=0;const html=data.map((p,i)=>{let s=state[i]||blank(),owned=!!s.checks?.[0],complete=p.tasks.every((_,j)=>s.checks?.[j]),teamColor=s.teamColor||'#f4efe3';if(!p.name.toLowerCase().includes(q)||f==='open'&&owned||f==='owned'&&!owned||f==='complete'&&!complete)return'';shown++;return `<article class="card ${complete?'complete':''}" style="--c:${colors[p.type]}"><div class="owner"><label for="team-${i}">Team name</label><div class="owner-row"><input id="team-${i}" data-team="${i}" value="${esc(s.team||'')}" style="color:${teamColor}" placeholder="Enter purchasing team…"><input type="color" data-team-color="${i}" value="${teamColor}" aria-label="Choose team-name color" title="Choose team-name color"></div></div><div class="title"><h2>${esc(p.name)}</h2><span class="tag">${esc(p.type)}</span></div><div class="costs">Initial: $${p.initial}${p.house?` · House: $${p.house}`:''}</div><div class="checks">${p.tasks.map((t,j)=>`<label class="check ${s.checks?.[j]?'done':''}"><input type="checkbox" data-check="${i},${j}" ${s.checks?.[j]?'checked':''}><span><b>${t[0]}</b><small>${esc(t[1])}</small></span></label>`).join('')}</div><table class="rents">${p.rents.map(r=>`<tr><td>${esc(r[0])}</td><td>${typeof r[1]==='number'?'$':''}${esc(r[1])}</td></tr>`).join('')}</table></article>`}).join('');document.querySelector('#grid').innerHTML=html||'<div class="empty">No properties match this filter.</div>';let owned=data.filter((_,i)=>state[i]?.checks?.[0]).length,done=data.filter((p,i)=>p.tasks.every((_,j)=>state[i]?.checks?.[j])).length;document.querySelector('#stats').textContent=`${owned} of ${data.length} purchased · ${done} fully complete · ${shown} shown`;document.querySelector('#reset').disabled=!isOrganizer();document.querySelector('#organizer').textContent=isOrganizer()?'Organizer logout':'Organizer login';if(activeId){const restored=document.getElementById(activeId);if(restored){restored.focus();if(sel!=null)restored.setSelectionRange?.(sel,sel)}}}
async function saveProperty(i){if(!currentUser)return;const s=state[i]||blank();try{await setDoc(doc(propertiesRef,String(i)),{teamName:s.team||'',teamColor:s.teamColor||'#f4efe3',checks:data[i].tasks.map((_,j)=>!!s.checks?.[j]),updatedAt:serverTimestamp(),updatedBy:currentUser.uid},{merge:true})}catch(e){setConnection(`Save failed: ${e.message}`,'error')}}
function listen(){unsubProperties?.();unsubProperties=onSnapshot(propertiesRef,{includeMetadataChanges:true},snap=>{let newest=0;for(const change of snap.docChanges()){const i=Number(change.doc.id);if(change.type==='removed')delete state[i];else{const d=change.doc.data();state[i]={team:d.teamName||'',teamColor:d.teamColor||'#f4efe3',checks:d.checks||[]};newest=Math.max(newest,d.updatedAt?.toMillis?.()||0)}}render();if(snap.metadata.hasPendingWrites)document.querySelector('#updated').textContent='Saving changes…';else if(newest)document.querySelector('#updated').textContent=`Last updated: ${new Date(newest).toLocaleString()}`;setConnection(snap.metadata.fromCache&&!navigator.onLine?'Offline — changes will sync later':'Live synchronization active',snap.metadata.fromCache&&!navigator.onLine?'offline':'online')},e=>setConnection(`Sync error: ${e.message}`,'error'))}
onAuthStateChanged(auth,async user=>{if(!user){await signInAnonymously(auth);return}currentUser=user;const eventSnap=await getDoc(eventRef);eventOwner=eventSnap.exists()?eventSnap.data().organizerUid:null;if(!eventOwner&&!user.isAnonymous){await setDoc(eventRef,{organizerUid:user.uid,createdAt:serverTimestamp(),eventCode:eventId});eventOwner=user.uid}listen();render()});
document.addEventListener('input',e=>{if(e.target.matches('[data-team]')){let i=e.target.dataset.team;state[i]??=blank();state[i].team=e.target.value;clearTimeout(typingTimers[i]);typingTimers[i]=setTimeout(()=>saveProperty(i),500)}else if(e.target.matches('[data-team-color]')){let i=e.target.dataset.teamColor;state[i]??=blank();state[i].teamColor=e.target.value;document.querySelector(`[data-team="${i}"]`).style.color=e.target.value;saveProperty(i)}else if(e.target.id==='search')render()});
document.addEventListener('change',e=>{if(e.target.matches('[data-check]')){let[i,j]=e.target.dataset.check.split(',');state[i]??=blank();state[i].checks[j]=e.target.checked;render();saveProperty(i)}else if(e.target.id==='filter')render()});
document.querySelector('#share').onclick=async()=>{await navigator.clipboard.writeText(location.href);document.querySelector('#share').textContent='Link copied!';setTimeout(()=>document.querySelector('#share').textContent='Copy event link',1500)};
const dialog=document.querySelector('#loginDialog');document.querySelector('#organizer').onclick=async()=>{if(isOrganizer())await signOut(auth);else dialog.showModal()};document.querySelector('#cancelLogin').onclick=()=>dialog.close();
document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();document.querySelector('#loginError').textContent='';try{await signInWithEmailAndPassword(auth,document.querySelector('#email').value,document.querySelector('#password').value);dialog.close()}catch(err){document.querySelector('#loginError').textContent=err.message}};
document.querySelector('#reset').onclick=async()=>{if(!isOrganizer()||!confirm('Reset every team name, color, and checkbox for this event?'))return;const batch=writeBatch(db);for(let i=0;i<data.length;i++)batch.delete(doc(propertiesRef,String(i)));try{await batch.commit()}catch(e){alert(`Reset failed: ${e.message}`)}};
document.querySelector('#eventCode').textContent=`Event: ${eventId}`;window.addEventListener('online',()=>setConnection('Back online — synchronizing','online'));window.addEventListener('offline',()=>setConnection('Offline — changes will sync later','offline'));render();
</script>
